<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>わが家の家計簿</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="家計簿">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12141c" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Maru+Gothic:wght@700&display=swap">
<style>
/* Layout: one narrow column like a pocket ledger; summary first, bottom tab bar for thumbs */
:root {
  --bg: #f6f7f9; --surface: #ffffff; --ink: #15192a; --ink-2: #4a5068; --muted: #8a8fa3;
  --line: #e3e5ec; --track: #eceef4; --accent: #2c4fa3; --accent-soft: #e6ecfa;
  --over: #c8372d; --over-soft: #fbe9e7; --warn-soft: #fff4e0; --warn: #8a5a00;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
  --font-display: "Zen Maru Gothic", "Zen Kaku Gothic New", "Hiragino Sans", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12141c; --surface: #1b1e29; --ink: #eef0f6; --ink-2: #b9bdcd; --muted: #80859a;
    --line: #2b2f3d; --track: #262a37; --accent: #8ea8f0; --accent-soft: #232c47;
    --over: #f07a6e; --over-soft: #3a2220; --warn-soft: #3a3020; --warn: #f0c46e; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px;
  line-height: 1.6; -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 10; }
main {
  max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: calc(12px + env(safe-area-inset-top, 0px)) calc(88px + env(safe-area-inset-bottom, 0px));
}
[hidden] { display: none !important; }
h1, h2 { font-family: var(--font-display); text-wrap: balance; margin: 0; }
h2 { font-size: 17px; }
p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-block: 4px 12px; }
.brand { font-family: var(--font-display); font-size: 15px; color: var(--ink-2); display: flex; align-items: center; gap: 6px; }
.sync { font-family: var(--font-body); font-size: 11px; padding: 1px 8px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); }
.month { display: flex; align-items: center; gap: 4px; }
.month button { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-size: 18px; line-height: 1; }
.month button:disabled { opacity: .35; cursor: default; }
.month strong { min-width: 6.5em; text-align: center; font-family: var(--font-display); font-size: 17px; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
.stack { display: grid; gap: 14px; }
.label { font-size: 12px; color: var(--muted); letter-spacing: .06em; }
.note { font-size: 13px; color: var(--muted); }

.hero-total { font-family: var(--font-display); font-size: 44px; line-height: 1.1; letter-spacing: -.01em; }
.hero-total small { font-size: 20px; margin-left: 2px; }
.budget-line { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; color: var(--ink-2); margin-top: 10px; flex-wrap: wrap; }
.meter { height: 10px; background: var(--track); border-radius: 6px; overflow: hidden; margin-top: 6px; }
.meter > div { height: 100%; background: var(--accent); border-radius: 0 6px 6px 0; }
.meter.over > div { background: var(--over); }
.perday { margin-top: 12px; padding: 10px 12px; background: var(--accent-soft); border-radius: 10px; font-size: 14px; }
.perday strong { font-size: 18px; }
.perday.over { background: var(--over-soft); color: var(--over); }
.sources { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 12px; font-size: 13px; color: var(--ink-2); }

.cat-row { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 8px 0; border-top: 1px solid var(--line); }
.cat-row:first-of-type { border-top: 0; }
.cat-row .name { font-weight: 500; min-width: 0; overflow-wrap: anywhere; }
.cat-row .amt { text-align: right; font-weight: 500; }
.cat-row .sub { grid-column: 1 / -1; display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
.cat-row .sub .warn { color: var(--over); font-weight: 700; }
.bar { grid-column: 1 / -1; height: 8px; background: var(--track); border-radius: 5px; overflow: hidden; }
.bar > div { height: 100%; background: var(--accent); border-radius: 0 5px 5px 0; min-width: 2px; }
.bar.over > div { background: var(--over); }

.amount-field { display: flex; align-items: baseline; gap: 6px; border-bottom: 2px solid var(--accent); padding-bottom: 4px; }
.amount-field input { border: 0; background: transparent; font-family: var(--font-display); font-size: 40px; width: 100%; min-width: 0; outline: none; }
.amount-field span { font-size: 20px; color: var(--ink-2); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 14px; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.field { display: grid; gap: 4px; min-width: 0; }
.field input { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 12px; width: 100%; min-width: 0; font-size: 16px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn { border: 0; border-radius: 12px; padding: 14px; font-weight: 700; background: var(--accent); color: var(--surface); width: 100%; font-size: 16px; }
.btn:disabled { opacity: .5; }
.btn.ghost { background: var(--accent-soft); color: var(--accent); }

.tx { display: grid; grid-template-columns: 1fr auto; gap: 0 12px; padding: 10px 0; border-top: 1px solid var(--line); align-items: center; }
.tx:first-child { border-top: 0; }
.tx .shop { min-width: 0; overflow-wrap: anywhere; }
.tx .meta { font-size: 12px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.tag { font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--track); color: var(--ink-2); }
.tag.cash { background: var(--accent-soft); color: var(--accent); }
.tag.pending { background: var(--warn-soft); color: var(--warn); }
.tx .amt { text-align: right; font-weight: 500; }
.tx .actions { grid-column: 1 / -1; display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; align-items: center; }
.linkish { background: none; border: 0; color: var(--muted); font-size: 12px; padding: 2px 4px; text-decoration: underline; }
.linkish.danger { color: var(--over); }

.budget-row { display: grid; grid-template-columns: 1fr 9em; gap: 10px; align-items: center; padding: 6px 0; border-top: 1px solid var(--line); }
.budget-row:first-child { border-top: 0; }
.budget-row label { min-width: 0; overflow-wrap: anywhere; }
.budget-row .yen { display: flex; align-items: center; gap: 4px; }
.budget-row input { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px; width: 100%; min-width: 0; text-align: right; font-size: 16px; }

nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  background: var(--surface); border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(4, 1fr);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
}
nav.tabs button { background: none; border: 0; padding: 10px 0 12px; font-size: 12px; color: var(--muted); display: grid; justify-items: center; gap: 2px; }
nav.tabs button svg { width: 22px; height: 22px; }
nav.tabs button[aria-selected="true"] { color: var(--accent); font-weight: 700; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(80px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 6; max-width: calc(100% - 32px); }
.empty { text-align: center; padding: 24px 8px; color: var(--ink-2); }
.err { color: var(--over); font-size: 13px; }
@media (prefers-reduced-motion: no-preference) { .meter > div, .bar > div { transition: width .3s ease; } }
</style>
</head>
<body>
<main>
  <div class="top">
    <span class="brand">わが家の家計簿 <span id="syncBadge" class="sync" hidden></span></span>
    <div class="month" id="monthNav">
      <button id="prevMonth" aria-label="前の月">‹</button>
      <strong id="monthLabel" class="num">—</strong>
      <button id="nextMonth" aria-label="次の月">›</button>
    </div>
  </div>

  <!-- 最初の設定 -->
  <section id="setup" class="stack" hidden>
    <div class="panel stack">
      <h2>はじめの設定</h2>
      <p class="note">Googleスプレッドシートの「ウェブアプリのURL」と「合言葉」を入れてください。この端末に保存されるので、入力は最初の1回だけです。</p>
      <div class="field"><label class="label" for="cfgUrl">ウェブアプリのURL</label><input id="cfgUrl" inputmode="url" autocomplete="off" placeholder="https://script.google.com/macros/s/…/exec"></div>
      <div class="field"><label class="label" for="cfgToken">合言葉</label><input id="cfgToken" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
      <p id="setupErr" class="err" hidden></p>
      <button id="saveSetup" class="btn">接続する</button>
    </div>
  </section>

  <section id="tab-home" class="stack"></section>

  <section id="tab-add" class="stack" hidden>
    <div class="panel stack">
      <h2>現金の支出を記録</h2>
      <div class="field">
        <span class="label">金額</span>
        <div class="amount-field"><input id="amount" inputmode="numeric" autocomplete="off" placeholder="0" aria-label="金額（円）"><span>円</span></div>
      </div>
      <div class="field">
        <span class="label">カテゴリ</span>
        <div id="catChips" class="chips"></div>
      </div>
      <div class="row2">
        <div class="field"><label class="label" for="date">日付</label><input id="date" type="date"></div>
        <div class="field"><label class="label" for="shop">お店（任意）</label><input id="shop" autocomplete="off" placeholder="例：スーパー"></div>
      </div>
      <div class="field"><label class="label" for="memo">メモ（任意）</label><input id="memo" autocomplete="off"></div>
      <button id="saveCash" class="btn">記録する</button>
    </div>
  </section>

  <section id="tab-list" class="stack" hidden></section>

  <section id="tab-budget" class="stack" hidden>
    <div class="panel stack">
      <div>
        <h2>月の予算</h2>
        <p class="note" style="margin-top:4px">カテゴリごとに1か月で使ってよい金額を入れてください。空欄のカテゴリは予算なしで集計だけします。</p>
      </div>
      <div id="budgetRows"></div>
      <div class="budget-line"><span>予算の合計</span><strong id="budgetTotal" class="num">0円</strong></div>
      <button id="saveBudget" class="btn">予算を保存</button>
    </div>
    <div class="panel stack">
      <h2>データ</h2>
      <p id="lastSync" class="note">—</p>
      <button id="reload" class="btn ghost">最新のデータを読み込む</button>
      <button id="openSetup" class="linkish" style="justify-self:start">接続設定を変える</button>
    </div>
  </section>
</main>

<nav class="tabs" role="tablist" id="tabs">
  <button role="tab" data-tab="home" aria-selected="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>ホーム</button>
  <button role="tab" data-tab="add" aria-selected="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>記録</button>
  <button role="tab" data-tab="list" aria-selected="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>明細</button>
  <button role="tab" data-tab="budget" aria-selected="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M16 15h2"/></svg>予算</button>
</nav>
<div id="toast" class="toast" hidden></div>

<script>
// ---------- 定数 ----------
const BASE_CATS = ["食料品・日用品", "外食", "コンビニ・売店", "交通費", "車", "買い物", "レジャー",
  "趣味・娯楽", "プレゼント・交際費", "ドラッグストア", "水道光熱費", "サブスク", "保険", "ウォーターサーバー", "その他"];
const KEY = { cfg: "kakeibo.cfg", cache: "kakeibo.cache", pending: "kakeibo.pending", pendingDel: "kakeibo.pendingDel" };

// ---------- 端末に保存する小さなデータ ----------
function load(k, fallback) { try { return JSON.parse(localStorage.getItem(k)) ?? fallback; } catch { return fallback; } }
function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }

// ---------- 状態 ----------
let cfg = load(KEY.cfg, null);                 // {url, token}
let pending = load(KEY.pending, []);           // まだ送れていない現金の記録
let pendingDel = load(KEY.pendingDel, []);     // まだ送れていない削除
const cached = load(KEY.cache, null);
const state = {
  tab: "home",
  month: monthKey(todayISO()),
  cash: cached?.cash || [],
  cards: cached?.cards || [],
  budget: cached?.budget || {},
  syncedAt: cached?.syncedAt || null,
  loaded: !!cached,
  loadError: null,
  listFilter: null,
  confirmDelete: null,
};
let pickedCat = "食料品・日用品", budgetDirty = false;

// ---------- 小さな道具 ----------
function todayISO() { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); }
function monthKey(iso) { return String(iso).slice(0, 7); }
function monthLabel(key) { const [y, m] = key.split("-"); return `${y}年${+m}月`; }
function shiftMonth(key, n) {
  let [y, m] = key.split("-").map(Number); m += n;
  while (m < 1) { m += 12; y--; } while (m > 12) { m -= 12; y++; }
  return `${y}-${String(m).padStart(2, "0")}`;
}
const yen = n => `${Math.round(n).toLocaleString("ja-JP")}円`;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const $ = id => document.getElementById(id);
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.timer); toast.timer = setTimeout(() => (t.hidden = true), 2400);
}
function toNumber(v) {
  const n = parseInt(String(v).replace(/[０-９]/g, d => String.fromCharCode(d.charCodeAt(0) - 0xFEE0)).replace(/[^\d]/g, ""), 10);
  return Number.isFinite(n) ? n : 0;
}
function newId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

// ---------- スプレッドシートとのやりとり ----------
async function api(action, payload = {}, c = cfg) {
  const res = await fetch(c.url, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },   // こうすると余計な事前確認が起きない
    body: JSON.stringify({ token: c.token, action, ...payload }),
  });
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || "error");
  return j;
}

async function refresh(quiet) {
  if (!cfg) return;
  await flushPending();
  try {
    const j = await api("load");
    state.cash = j.cash; state.cards = j.cards; state.budget = j.budget;
    state.syncedAt = new Date().toISOString(); state.loaded = true; state.loadError = null;
    save(KEY.cache, { cash: j.cash, cards: j.cards, budget: j.budget, syncedAt: state.syncedAt });
    if (!quiet) toast("最新のデータを読み込みました");
  } catch (e) {
    state.loadError = e.message === "bad_token" ? "合言葉が違います。接続設定を確認してください" : "読み込めませんでした。電波のよい場所でもう一度お試しください";
    if (!quiet || !state.loaded) toast(state.loadError);
  }
  render();
}

// 電波がなかったときの記録・削除を送る
async function flushPending() {
  for (const rec of [...pending]) {
    try { await api("addCash", { rec }); pending = pending.filter(p => p.id !== rec.id); save(KEY.pending, pending); }
    catch { break; }
  }
  for (const id of [...pendingDel]) {
    try { await api("deleteCash", { id }); pendingDel = pendingDel.filter(p => p !== id); save(KEY.pendingDel, pendingDel); }
    catch { break; }
  }
  updateSyncBadge();
}
function updateSyncBadge() {
  const n = pending.length + pendingDel.length;
  $("syncBadge").hidden = n === 0;
  $("syncBadge").textContent = `未送信 ${n}件`;
}

// ---------- データの見方 ----------
function allCash() {
  const del = new Set(pendingDel);
  const ids = new Set(state.cash.map(c => c.id));
  return [...state.cash.filter(c => !del.has(c.id)), ...pending.filter(p => !ids.has(p.id)).map(p => ({ ...p, pending: true }))];
}
function allCats() {
  const s = new Set(BASE_CATS);
  state.cards.forEach(i => i.cat && s.add(i.cat));
  allCash().forEach(c => c.cat && s.add(c.cat));
  Object.keys(state.budget).forEach(c => s.add(c));
  s.delete("その他"); return [...s, "その他"];
}
function availableMonths() {
  const s = new Set([monthKey(todayISO()), ...state.cards.map(c => c.month), ...allCash().map(c => c.month)]);
  return [...s].filter(Boolean).sort();
}
function monthTx(key) {
  const card = state.cards.filter(i => i.month === key).map((i, n) => ({
    key: "c" + n, date: i.d || "", shop: i.shop, amt: Number(i.amt), cat: i.cat || "その他",
    source: i.card, kind: i.kind, isCash: false,
  }));
  const cash = allCash().filter(c => c.month === key).map(c => ({
    key: c.id, id: c.id, date: String(c.date || "").replaceAll("-", "/"), shop: c.shop || c.cat, amt: Number(c.amt),
    cat: c.cat || "その他", source: "現金", memo: c.memo, isCash: true, pending: c.pending,
  }));
  return [...card, ...cash];
}
function sumBy(list, field) {
  const m = new Map();
  list.forEach(t => m.set(t[field], (m.get(t[field]) || 0) + t.amt));
  return [...m.entries()].sort((a, b) => b[1] - a[1]);
}

// ---------- 描画 ----------
function render() {
  const needSetup = !cfg || state.tab === "setup";
  $("setup").hidden = !needSetup;
  $("tabs").hidden = !cfg;
  $("monthNav").style.visibility = (needSetup || state.tab === "add" || state.tab === "budget") ? "hidden" : "visible";
  ["home", "add", "list", "budget"].forEach(t => ($("tab-" + t).hidden = needSetup || t !== state.tab));
  if (needSetup) return;

  const months = availableMonths();
  $("monthLabel").textContent = monthLabel(state.month);
  $("prevMonth").disabled = state.month <= months[0];
  $("nextMonth").disabled = state.month >= months[months.length - 1];
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === state.tab));
  $("lastSync").textContent = state.syncedAt
    ? `最後に読み込んだ時刻：${new Date(state.syncedAt).toLocaleString("ja-JP", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" })}`
    : "まだ読み込んでいません";
  renderHome(); renderList(); renderChips(); updateSyncBadge();
  if (!budgetDirty) renderBudgetRows();
}

function renderHome() {
  const el = $("tab-home");
  if (!state.loaded) {
    el.innerHTML = `<div class="panel empty">${state.loadError ? esc(state.loadError) : "読み込み中…"}</div>`;
    return;
  }
  const tx = monthTx(state.month);
  const total = tx.reduce((a, t) => a + t.amt, 0);
  const budgetTotal = Object.values(state.budget).reduce((a, b) => a + (+b || 0), 0);
  const isThisMonth = state.month === monthKey(todayISO());
  const hasCard = state.cards.some(c => c.month === state.month);

  let budgetHtml;
  if (budgetTotal > 0) {
    const left = budgetTotal - total, ratio = Math.min(total / budgetTotal, 1) * 100, over = left < 0;
    budgetHtml = `
      <div class="budget-line"><span>予算 ${yen(budgetTotal)}</span>
        <span class="num" style="${over ? "color:var(--over);font-weight:700" : ""}">${over ? `${yen(-left)} オーバー` : `あと ${yen(left)}`}</span></div>
      <div class="meter ${over ? "over" : ""}"><div style="width:${ratio}%"></div></div>`;
    if (isThisMonth) {
      const now = new Date(), last = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
      const daysLeft = last - now.getDate() + 1;
      budgetHtml += over
        ? `<div class="perday over">今月は予算を超えています。ここからは必要なものだけにしましょう。</div>`
        : `<div class="perday">月末まであと${daysLeft}日。1日あたり <strong class="num">${yen(left / daysLeft)}</strong> 使えます</div>`;
    }
  } else {
    budgetHtml = `<p class="note" style="margin-top:10px">「予算」タブで予算を決めると、残りの金額と1日あたり使える額が出ます。</p>`;
  }

  const sources = sumBy(tx, "source").map(([s, a]) => `<span>${esc(s)} <b class="num">${yen(a)}</b></span>`).join("");
  const cardNote = hasCard ? "" :
    `<p class="note" style="margin-top:8px">この月のカード明細はまだ入っていません。明細が出たらPCで取り込んで反映します。</p>`;

  const cats = sumBy(tx, "cat");
  const maxSpent = Math.max(1, ...cats.map(c => c[1]));
  Object.keys(state.budget).forEach(c => { if (+state.budget[c] > 0 && !cats.some(x => x[0] === c)) cats.push([c, 0]); });
  const rows = cats.map(([cat, amt]) => {
    const b = +state.budget[cat] || 0;
    if (b > 0) {
      const over = amt > b;
      return `<div class="cat-row"><span class="name">${esc(cat)}</span><span class="amt num">${yen(amt)}</span>
        <div class="bar ${over ? "over" : ""}"><div style="width:${Math.min(amt / b, 1) * 100}%"></div></div>
        <div class="sub"><span>予算 ${yen(b)}</span>${over ? `<span class="warn">! ${yen(amt - b)} オーバー</span>` : `<span>あと ${yen(b - amt)}</span>`}</div></div>`;
    }
    return `<div class="cat-row"><span class="name">${esc(cat)}</span><span class="amt num">${yen(amt)}</span>
      <div class="bar"><div style="width:${amt / maxSpent * 100}%"></div></div>
      <div class="sub"><span>${total ? Math.round(amt / total * 100) : 0}%</span><span>予算なし</span></div></div>`;
  }).join("");

  el.innerHTML = `
    <div class="panel">
      <div class="label">${monthLabel(state.month)}分の支出</div>
      <div class="hero-total num">${Math.round(total).toLocaleString("ja-JP")}<small>円</small></div>
      ${budgetHtml}
      <div class="sources">${sources || `<span>まだ記録がありません</span>`}</div>
      ${cardNote}
    </div>
    <div class="panel">
      <h2 style="margin-bottom:6px">カテゴリ別</h2>
      ${rows || `<div class="empty">この月の支出はまだありません。<br>「記録」タブから現金の支出を入れられます。</div>`}
    </div>
    <p class="note">カードは引き落とし月で数えます（10日までの引き落としは前月分）。現金は使った日の月です。</p>`;
}

function renderList() {
  const el = $("tab-list");
  if (!state.loaded) { el.innerHTML = `<div class="panel empty">読み込み中…</div>`; return; }
  const tx = monthTx(state.month);
  const cats = sumBy(tx, "cat").map(c => c[0]);
  if (state.listFilter && !cats.includes(state.listFilter)) state.listFilter = null;
  const shown = tx.filter(t => !state.listFilter || t.cat === state.listFilter)
    .sort((a, b) => (b.date || "").localeCompare(a.date || "", "ja", { numeric: true }) || b.amt - a.amt);

  const chips = [`<button class="chip" data-filter="" aria-pressed="${!state.listFilter}">すべて</button>`,
    ...cats.map(c => `<button class="chip" data-filter="${esc(c)}" aria-pressed="${state.listFilter === c}">${esc(c)}</button>`)].join("");

  const rows = shown.map(t => {
    const confirming = state.confirmDelete === t.key;
    const actions = t.isCash ? `<div class="actions">
        ${confirming
          ? `<span class="note">削除しますか？</span><button class="linkish danger" data-del-yes="${esc(t.id)}">削除する</button><button class="linkish" data-del-no>やめる</button>`
          : `<button class="linkish" data-del="${esc(t.key)}">削除</button>`}
      </div>` : "";
    return `<div class="tx">
      <div class="shop">${esc(t.shop)}
        <div class="meta"><span class="num">${esc(t.date)}</span><span class="tag ${t.isCash ? "cash" : ""}">${esc(t.source)}</span>${t.pending ? `<span class="tag pending">未送信</span>` : ""}<span>${esc(t.cat)}</span>${t.kind && t.kind !== "1回" ? `<span>${esc(t.kind)}</span>` : ""}${t.memo ? `<span>${esc(t.memo)}</span>` : ""}</div>
      </div>
      <div class="amt num">${yen(t.amt)}</div>${actions}</div>`;
  }).join("");

  const sum = shown.reduce((a, t) => a + t.amt, 0);
  el.innerHTML = `
    <div class="chips">${chips}</div>
    <div class="panel">
      <div class="budget-line" style="margin:0 0 6px"><span>${shown.length}件</span><strong class="num">${yen(sum)}</strong></div>
      ${rows || `<div class="empty">この月の明細はまだありません</div>`}
    </div>`;
}

function renderChips() {
  $("catChips").innerHTML = allCats().map(c =>
    `<button type="button" class="chip" data-cat="${esc(c)}" aria-pressed="${c === pickedCat}">${esc(c)}</button>`).join("");
}
function renderBudgetRows() {
  $("budgetRows").innerHTML = allCats().map((c, i) => `
    <div class="budget-row"><label for="b${i}">${esc(c)}</label>
      <span class="yen"><input id="b${i}" data-budget="${esc(c)}" inputmode="numeric" placeholder="—" value="${state.budget[c] ? state.budget[c] : ""}"><span>円</span></span></div>`).join("");
  updateBudgetTotal();
}
function updateBudgetTotal() {
  let t = 0; document.querySelectorAll("[data-budget]").forEach(i => (t += toNumber(i.value)));
  $("budgetTotal").textContent = yen(t);
}

// ---------- 操作 ----------
document.addEventListener("click", async e => {
  const tab = e.target.closest("[data-tab]");
  if (tab) { state.tab = tab.dataset.tab; state.confirmDelete = null; render(); window.scrollTo(0, 0); return; }
  const cat = e.target.closest("[data-cat]");
  if (cat) { pickedCat = cat.dataset.cat; renderChips(); return; }
  const f = e.target.closest("[data-filter]");
  if (f) { state.listFilter = f.dataset.filter || null; renderList(); return; }
  const del = e.target.closest("[data-del]");
  if (del) { state.confirmDelete = del.dataset.del; renderList(); return; }
  if (e.target.closest("[data-del-no]")) { state.confirmDelete = null; renderList(); return; }
  const yes = e.target.closest("[data-del-yes]");
  if (yes) {
    const id = yes.dataset.delYes;
    state.confirmDelete = null;
    if (pending.some(p => p.id === id)) {            // まだ送っていない記録は、端末から消すだけ
      pending = pending.filter(p => p.id !== id); save(KEY.pending, pending);
    } else {
      pendingDel.push(id); save(KEY.pendingDel, pendingDel);
    }
    render(); toast("削除しました");
    flushPending().then(() => render());
  }
});
$("prevMonth").onclick = () => { state.month = shiftMonth(state.month, -1); render(); };
$("nextMonth").onclick = () => { state.month = shiftMonth(state.month, 1); render(); };
$("budgetRows").addEventListener("input", () => { budgetDirty = true; updateBudgetTotal(); });
$("reload").onclick = () => refresh(false);
$("openSetup").onclick = () => {
  $("cfgUrl").value = cfg?.url || ""; $("cfgToken").value = cfg?.token || "";
  state.tab = "setup"; render();
};

$("saveSetup").onclick = async () => {
  const c = { url: $("cfgUrl").value.trim(), token: $("cfgToken").value.trim() };
  const err = $("setupErr"); err.hidden = true;
  if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(c.url) || !c.token) {
    err.textContent = "URLは https://script.google.com/ で始まるものを、合言葉は設定時に表示されたものを入れてください";
    err.hidden = false; return;
  }
  const btn = $("saveSetup"); btn.disabled = true; btn.textContent = "確認中…";
  try {
    await api("load", {}, c);
    cfg = c; save(KEY.cfg, cfg); state.tab = "home";
    await refresh(true); toast("接続できました");
  } catch (e) {
    err.textContent = e.message === "bad_token" ? "合言葉が違います" : "接続できませんでした。URLが正しいか、デプロイで「アクセスできるユーザー：全員」になっているか確認してください";
    err.hidden = false;
  }
  btn.disabled = false; btn.textContent = "接続する";
};

$("saveBudget").onclick = async () => {
  const amounts = {};
  document.querySelectorAll("[data-budget]").forEach(i => { const n = toNumber(i.value); if (n > 0) amounts[i.dataset.budget] = n; });
  $("saveBudget").disabled = true;
  try {
    await api("setBudget", { amounts });
    state.budget = amounts; budgetDirty = false;
    save(KEY.cache, { cash: state.cash, cards: state.cards, budget: amounts, syncedAt: state.syncedAt });
    toast("予算を保存しました"); render();
  } catch { toast("保存できませんでした。電波のよい場所でもう一度お試しください"); }
  $("saveBudget").disabled = false;
};

$("saveCash").onclick = async () => {
  const amt = toNumber($("amount").value);
  const date = $("date").value || todayISO();
  if (!amt) { toast("金額を入れてください"); $("amount").focus(); return; }
  const rec = { id: newId(), date, month: monthKey(date), amt, cat: pickedCat, shop: $("shop").value.trim(), memo: $("memo").value.trim() };
  // まず端末に置いてから送る（電波がなくても記録は消えない）
  pending.push(rec); save(KEY.pending, pending);
  $("amount").value = ""; $("shop").value = ""; $("memo").value = "";
  render();
  toast(`${yen(amt)}（${rec.cat}）を記録しました`);
  await flushPending();
  if (!pending.some(p => p.id === rec.id)) {
    state.cash.push(rec);
    save(KEY.cache, { cash: state.cash, cards: state.cards, budget: state.budget, syncedAt: state.syncedAt });
  } else {
    toast("電波がないため端末に保存しました。つながったら自動で送ります");
  }
  render();
};
$("amount").addEventListener("input", e => {
  const n = toNumber(e.target.value); e.target.value = n ? n.toLocaleString("ja-JP") : "";
});

// アプリに戻ってきたとき・電波が戻ったときに最新にする
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") refresh(true); });
window.addEventListener("online", () => refresh(true));

// ---------- 起動 ----------
$("date").value = todayISO();
render();
if (cfg) refresh(true);
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
